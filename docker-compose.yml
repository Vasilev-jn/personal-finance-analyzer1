services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moneymap:latest
    container_name: moneymap
    ports:
      - "5059:5059"
    environment:
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-llama-3.1-8b-instant}
      AGENT_LLM_API_URL: ${AGENT_LLM_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
