services:
  postgres:
    image: postgres:16-alpine
    container_name: moneymap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneymap}
      POSTGRES_USER: ${POSTGRES_USER:-moneymap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moneymap:latest
    container_name: moneymap
    ports:
      - "5059:5059"
    environment:
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-llama-3.1-8b-instant}
      AGENT_LLM_API_URL: ${AGENT_LLM_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_URL: ${LLM_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://moneymap:moneymap@postgres:5432/moneymap}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    restart: unless-stopped

volumes:
  postgres_data:
